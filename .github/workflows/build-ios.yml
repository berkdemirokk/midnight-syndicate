# =====================================================================
# MIDNIGHT SYNDICATE - iOS build and TestFlight upload. MANUAL ONLY (workflow_dispatch), macOS runner.
#
# Cost: the repo is public, so GitHub-hosted macOS runners are free (docs/research/07).
#
# Signing: App Store Connect API key only. Xcode's automatic signing (-allowProvisioningUpdates with the
# key) creates or reuses the Apple Distribution certificate and the App Store profile in the cloud, so no
# .p12 or .mobileprovision has to be made on Windows. The key needs the Admin role for that.
#
# Repository secrets (names only here; the values live only in GitHub > Settings > Secrets > Actions):
#   APPLE_TEAM_ID     10-character Team ID (developer.apple.com > Membership)
#   ASC_KEY_ID        App Store Connect API key ID
#   ASC_ISSUER_ID     App Store Connect API issuer ID
#   ASC_KEY_P8        full text of the downloaded AuthKey_XXXX.p8 file (BEGIN/END lines included)
#
# Inputs: upload=false builds and archives only (a check run); upload=true also sends the build to
# App Store Connect, where it appears in TestFlight after Apple's processing. The app record with bundle
# ID com.berkdemirok.midnightsyndicate must exist in App Store Connect before the first upload.
# =====================================================================

name: build-ios (manual, macOS)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to App Store Connect / TestFlight"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS export, archive and upload
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      GODOT_TAG: "4.7.2-stable"
      GODOT_MAC_ZIP: "Godot_v4.7.2-stable_macos.universal.zip"
      TPZ_FILE: "Godot_v4.7.2-stable_export_templates.tpz"
      TPL_DIR_NAME: "4.7.2.stable"
      BUNDLE_ID: "com.berkdemirok.midnightsyndicate"
    steps:
      - name: Checkout (no LFS)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Check secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$TEAM" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ISS" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Cache Godot macOS editor
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot-mac
          key: godot-4.7.2-stable-macos-universal-v1

      - name: Cache export templates
        id: cache-tpl
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/Godot/export_templates/4.7.2.stable
          key: godot-4.7.2-stable-ios-templates-v2

      - name: Download and verify Godot macOS editor
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-mac" && cd "$RUNNER_TEMP/godot-mac"
          BASE="https://github.com/godotengine/godot/releases/download/$GODOT_TAG"
          curl -fsSL -o "$GODOT_MAC_ZIP" "$BASE/$GODOT_MAC_ZIP"
          curl -fsSL -o SHA512-SUMS.txt "$BASE/SHA512-SUMS.txt"
          grep -F " $GODOT_MAC_ZIP" SHA512-SUMS.txt | shasum -a 512 -c -
          unzip -q -o "$GODOT_MAC_ZIP"
          xattr -dr com.apple.quarantine Godot.app || true
          rm -f "$GODOT_MAC_ZIP"

      - name: Download and verify export templates (iOS + version only)
        if: steps.cache-tpl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tpl" && cd "$RUNNER_TEMP/tpl"
          BASE="https://github.com/godotengine/godot/releases/download/$GODOT_TAG"
          curl -fsSL -o "$TPZ_FILE" "$BASE/$TPZ_FILE"
          curl -fsSL -o SHA512-SUMS.txt "$BASE/SHA512-SUMS.txt"
          grep -F " $TPZ_FILE" SHA512-SUMS.txt | shasum -a 512 -c -
          DEST="$HOME/Library/Application Support/Godot/export_templates/$TPL_DIR_NAME"
          mkdir -p "$DEST"
          unzip -q -o -j "$TPZ_FILE" "templates/version.txt" "templates/ios.zip" -d "$DEST"
          ls -la "$DEST"
          rm -f "$TPZ_FILE"

      - name: Export the Xcode project from Godot
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot-mac/Godot.app/Contents/MacOS/Godot"
          # Team ID comes from the secret, never from the repo.
          sed -i '' "s/^application\/app_store_team_id=\"\"/application\/app_store_team_id=\"$TEAM\"/" game/export_presets.cfg
          sed -i '' "s/^application\/version=\"1\"/application\/version=\"${GITHUB_RUN_NUMBER}\"/" game/export_presets.cfg
          mkdir -p build/ios
          "$GODOT" --headless --audio-driver Dummy --path game --import
          "$GODOT" --headless --audio-driver Dummy --path game --export-release "iOS" "$GITHUB_WORKSPACE/build/ios/MidnightSyndicate.ipa"
          ls -la build/ios
          PROJ=$(ls -d build/ios/*.xcodeproj | head -1)
          [ -n "$PROJ" ] || { echo "::error::No .xcodeproj produced"; exit 1; }
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "SCHEME=$(basename "$PROJ" .xcodeproj)" >> "$GITHUB_ENV"

      - name: Xcode and SDK versions
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Write the API key file
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/asc/AuthKey_${KID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${KID}.p8"

      - name: Archive (automatic signing through the API key)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJ" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/ios/MidnightSyndicate.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${KID}.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Export the IPA (and upload to App Store Connect when asked)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          set -euo pipefail
          DEST=export
          [ "$UPLOAD" = "true" ] && DEST=upload
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${DEST}</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/ios/MidnightSyndicate.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$GITHUB_WORKSPACE/build/ios/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${KID}.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"
          ls -la build/ios/export || true

      - name: Upload IPA artifact (check runs)
        if: ${{ !inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/export/*.ipa
          if-no-files-found: warn
          retention-days: 7

      - name: Remove the API key file
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
